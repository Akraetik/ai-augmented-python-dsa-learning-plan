<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section 00 · Diagnostic and Checkpoint</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d1d1b;--mut:#6b6a65;--line:#e3e1da;--acc:#2f5d8a;--ok:#2e7d4f;--bad:#b3412f;--code:#f0eee8}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1d1d1b;--ink:#ecebe6;--mut:#9c9a93;--line:#33322e;--acc:#7fb0e0;--ok:#6cc58f;--bad:#ec8a78;--code:#262522}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:1.5rem;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 24px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 14px}
.qh{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.qt{font-weight:600;margin:6px 0 10px}
pre{background:var(--code);border-radius:6px;padding:10px 12px;overflow-x:auto;font:14px/1.45 ui-monospace,Consolas,monospace;margin:0 0 10px}
label{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin:6px 0;cursor:pointer}
label:hover{border-color:var(--acc)}input{margin-right:8px}
label.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
label.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.why{display:none;margin-top:10px;padding:10px;border-left:3px solid var(--acc);background:var(--code);border-radius:4px;font-size:.95rem}
.done .why{display:block}
.study{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.9rem;color:var(--mut)}
.study b{color:var(--ink)}
ol.miss li{margin:4px 0}
button{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);cursor:pointer;margin:4px 8px 4px 0}
button.ghost{background:transparent;color:var(--acc)}
#result{display:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 20px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%}
.row{display:flex;justify-content:space-between;font-size:.95rem}
.big{font-size:2rem;font-weight:700}
code{font-family:ui-monospace,Consolas,monospace;background:var(--code);padding:1px 4px;border-radius:3px}
</style></head><body><main>
<h1>Section 00 · Diagnostic and Checkpoint</h1><p class="sub">26 questions · pass mark 85% · no notes, no IDE, no AI</p>
<div id="result"></div>
<form id="f"></form>
<button id="submit">Score it</button><button class="ghost" id="reset">Start over</button>
</main>
<script>
const QUIZ = {"title": "Section 00 \u00b7 Diagnostic and Checkpoint", "pass_mark": 0.85, "pass_msg": "Do the Section 00 Anki deck for a few days, finish labs 09\u201311, then start Section 01.", "fail_msg": "Work the lessons for your weak topics below, do their labs, then retake in 2 days.", "topics": {"format": "How tests are graded", "bigo": "Big-O", "lists": "Lists and indexing", "strings": "Strings", "loops": "Loops and returns", "dictset": "Dicts and sets", "tools": "collections and sorting", "debug": "Routine and debugging"}, "review": {"format": "Lesson 00.1. Re-read 'Return, don't print' and 'Hidden tests'.", "bigo": "Lesson 00.2, the ladder and the constraints table. Redo `lab_01_bigo_spotter.py` and `lab_10_speed_trap.py`.", "lists": "Lesson 00.3, Lists. Redo `lab_00_trace_basics.py` and `lab_04_reverse_in_place.py`.", "strings": "Lesson 00.3, Strings. Practice `split`, `join`, `ord`, slicing in a scratch file.", "loops": "Lesson 00.3, Loops. Redo `lab_07_max_consecutive_ones.py`. Check MISTAKES M4, M5, M7.", "dictset": "Lesson 00.4. Redo `lab_05_contains_duplicate.py` and `lab_09_two_sum.py`.", "tools": "Lesson 00.4, collections and Sorting. Redo `lab_08_valid_anagram.py` with Counter.", "debug": "Lesson 00.5. Redo `lab_11_bug_hunt.py` and trace two labs on paper."}, "questions": [{"id": "d01", "study": "00.1 How Coding Tests Work \u203a Return, don't print", "topic": "format", "q": "A function prints the correct answer, but the grader marks every test wrong. Most likely cause?", "options": ["The grader is broken", "The function prints instead of returning, so it returns `None`", "Python 3 is required", "The function is too slow"], "answer": 1, "why": "Graders read the return value. A function with no `return` gives back `None`."}, {"id": "d02", "study": "00.1 How Coding Tests Work \u203a Return, don't print (in-place problems)", "topic": "format", "q": "A problem's signature ends in `-> None` and says \"modify nums in place.\" What should your function do?", "options": ["Return a new sorted list", "Change the list it was given and return nothing", "Print the list", "Return `True` when done"], "answer": 1, "why": "`-> None` plus \"in place\" means: change the input list itself. The grader inspects that list."}, {"id": "d03", "study": "00.2 Big-O \u203a Read the constraints, know your target", "topic": "bigo", "q": "Constraints say `1 <= n <= 10^5`. Which approach will likely time out?", "options": ["Sort, then one pass", "One pass with a set", "Two nested loops over all pairs", "One pass with two pointers"], "answer": 2, "why": "All pairs of 100,000 items is about 5 billion steps. Python manages tens of millions per second."}, {"id": "d04", "study": "00.2 Big-O \u203a The halving loop: O(log n)", "topic": "bigo", "q": "What is the time complexity?", "code": "i = n\nwhile i > 1:\n    i = i // 2", "options": ["O(1)", "O(log n)", "O(n)", "O(n log n)"], "answer": 1, "why": "`i` is halved each pass, so the loop runs about log2(n) times."}, {"id": "d05", "study": "00.2 Big-O \u203a Hidden loops in Python (`in` on a list)", "topic": "bigo", "q": "What is the time complexity? (`nums` is a list of length n.)", "code": "for x in nums:\n    if -x in nums:\n        return True", "options": ["O(n)", "O(n log n)", "O(n^2)", "O(1)"], "answer": 2, "why": "`-x in nums` scans the list each time. That's a hidden loop inside the visible loop."}, {"id": "d06", "study": "00.2 Big-O \u203a Hidden loops in Python (pop(0))", "topic": "bigo", "q": "Which operation is O(n) on a Python list of length n?", "options": ["`nums.append(5)`", "`nums[-1]`", "`nums.pop()`", "`nums.pop(0)`"], "answer": 3, "why": "`pop(0)` shifts every remaining item left. Use `collections.deque.popleft()` instead."}, {"id": "d07", "study": "00.2 Big-O \u203a Drop constants and small terms", "topic": "bigo", "q": "You sort a list, then loop over it once. Overall time?", "options": ["O(n)", "O(n log n)", "O(n^2)", "O(n + log n)"], "answer": 1, "why": "O(n log n) + O(n). Keep the biggest term."}, {"id": "d08", "study": "00.3 Python Toolkit 1 \u203a Slicing", "topic": "lists", "q": "What does this print?", "code": "nums = [10, 20, 30, 40]\nprint(nums[1:3], nums[-1])", "options": ["[20, 30] 40", "[20, 30, 40] 40", "[10, 20, 30] 10", "[20, 30] 30"], "answer": 0, "why": "Slices stop before the stop index. `nums[-1]` is the last item."}, {"id": "d09", "study": "00.3 Python Toolkit 1 \u203a Index vs value", "topic": "lists", "q": "In `for x in nums:`, what is `x`?", "options": ["An index", "A value from the list", "The length", "A copy of the list"], "answer": 1, "why": "A plain `for` gives values. Use `range(len(nums))` for indexes or `enumerate` for both (Mistake M1)."}, {"id": "d10", "study": "00.3 Python Toolkit 1 \u203a Functions (b = a doesn't copy)", "topic": "lists", "q": "What does this print?", "code": "a = [1, 2]\nb = a\nb.append(3)\nprint(a)", "options": ["[1, 2]", "[1, 2, 3]", "[3]", "Error"], "answer": 1, "why": "`b = a` doesn't copy. Both names point to the same list."}, {"id": "d11", "study": "00.3 Python Toolkit 1 \u203a Lists of lists: the trap", "topic": "lists", "q": "Which line correctly builds a 3x3 grid of zeros with independent rows?", "options": ["`[[0] * 3] * 3`", "`[0] * 9`", "`[[0] * 3 for _ in range(3)]`", "`[[0, 0, 0]] * 3`"], "answer": 2, "why": "Multiplying the outer list copies references to ONE row. The comprehension makes three separate rows."}, {"id": "d12", "study": "00.3 Python Toolkit 1 \u203a String tools: split()", "topic": "strings", "q": "What does this print?", "code": "s = \"  the  sky is \"\nprint(s.split())", "options": ["['', 'the', '', 'sky', 'is', '']", "['the', 'sky', 'is']", "['the  sky is']", "['  the', 'sky', 'is ']"], "answer": 1, "why": "`split()` with no argument splits on any run of whitespace and drops empty pieces."}, {"id": "d13", "study": "00.3 Python Toolkit 1 \u203a Building a string: use a list", "topic": "strings", "q": "What's the fast way to build a long string in a loop?", "options": ["`out += piece` each time", "Append pieces to a list, then `''.join(parts)` once", "Use `out = out + piece`", "Convert to a set first"], "answer": 1, "why": "Strings are immutable, so `+=` makes a new string every pass. One `join` at the end is linear."}, {"id": "d14", "study": "00.3 Python Toolkit 1 \u203a Characters as numbers", "topic": "strings", "q": "What does `ord('e') - ord('a')` return?", "options": ["4", "5", "'e'", "101"], "answer": 0, "why": "a=0, b=1, c=2, d=3, e=4. This maps letters to indexes 0\u201325."}, {"id": "d15", "study": "00.3 Python Toolkit 1 \u203a Returning from inside a loop (M7)", "topic": "loops", "q": "What's wrong with this check for \"all numbers are positive\"?", "code": "def all_pos(nums):\n    for x in nums:\n        if x > 0:\n            return True\n    return False", "options": ["Nothing", "It returns True after seeing ONE positive number", "It should use `while`", "`x > 0` should be `x >= 0`"], "answer": 1, "why": "Mistake M7: a True answer usually waits until every item is checked. Return False early on a bad one."}, {"id": "d16", "study": "00.3 Python Toolkit 1 \u203a while loops (M4)", "topic": "loops", "q": "What does this loop do?", "code": "left, right = 0, 5\nwhile left < right:\n    left + 1", "options": ["Runs 5 times", "Runs forever", "Runs 0 times", "Raises an error"], "answer": 1, "why": "Mistake M4: `left + 1` computes a value and throws it away. `left` never changes. It needs `left += 1`."}, {"id": "d17", "study": "00.3 Python Toolkit 1 \u203a for loops: range()", "topic": "loops", "q": "`range(2, 11, 3)` produces which numbers?", "options": ["2, 5, 8, 11", "2, 5, 8", "3, 6, 9", "2, 4, 6, 8, 10"], "answer": 1, "why": "Start 2, step 3, stop before 11: 2, 5, 8."}, {"id": "d18", "study": "00.4 Python Toolkit 2 \u203a Sets", "topic": "dictset", "q": "You need to answer \"have I seen this value before?\" many times. Best tool?", "options": ["A list and `in`", "A set", "Sorting each time", "A string"], "answer": 1, "why": "Set membership is O(1). List membership is O(n)."}, {"id": "d19", "study": "00.4 Python Toolkit 2 \u203a Dicts: pattern counting", "topic": "dictset", "q": "What does this return?", "code": "counts = {}\nfor ch in \"abca\":\n    counts[ch] = counts.get(ch, 0) + 1\nreturn counts", "options": ["{'a': 1, 'b': 1, 'c': 1}", "{'a': 2, 'b': 1, 'c': 1}", "['a', 'b', 'c', 'a']", "KeyError"], "answer": 1, "why": "`.get(ch, 0)` returns 0 for a new key, so no KeyError. 'a' appears twice."}, {"id": "d20", "study": "00.4 Python Toolkit 2 \u203a Dicts: remember where you saw it", "topic": "dictset", "q": "In Two Sum, what does the dict store?", "options": ["index -> value", "value -> index of where you saw it", "value -> count", "target -> answer"], "answer": 1, "why": "Standing on x, you look up `target - x`. You need that value's index, so map value -> index."}, {"id": "d21", "study": "00.4 Python Toolkit 2 \u203a Tuples and unpacking (hashable keys)", "topic": "dictset", "q": "Why does `{[1, 2]}` raise an error?", "options": ["Sets can't hold numbers", "Lists are mutable, so they can't go in a set", "Sets need two items", "Missing a comma"], "answer": 1, "why": "Set items and dict keys must be hashable (immutable). Use a tuple `(1, 2)`."}, {"id": "d22", "study": "00.4 Python Toolkit 2 \u203a Counter", "topic": "tools", "q": "Which is the quickest correct anagram check?", "options": ["`set(s) == set(t)`", "`Counter(s) == Counter(t)`", "`len(s) == len(t)`", "`s == t[::-1]`"], "answer": 1, "why": "Sets lose counts: 'aab' and 'abb' have the same set. Counter keeps counts."}, {"id": "d23", "study": "00.4 Python Toolkit 2 \u203a Sorting (.sort() returns None)", "topic": "tools", "q": "What is `x` after this line?", "code": "x = [3, 1, 2].sort()", "options": ["[1, 2, 3]", "[3, 1, 2]", "None", "Error"], "answer": 2, "why": "`.sort()` sorts in place and returns None. Use `sorted(...)` to get a new list."}, {"id": "d24", "study": "00.4 Python Toolkit 2 \u203a deque", "topic": "tools", "q": "You need to remove from the front of a queue thousands of times. Use:", "options": ["`list.pop(0)`", "`collections.deque.popleft()`", "`list.remove(x)`", "Slicing `q = q[1:]`"], "answer": 1, "why": "deque removes from either end in O(1). The others are O(n) each time."}, {"id": "d25", "study": "00.5 Routine and Debugging \u203a Reading error messages (IndexError)", "topic": "debug", "q": "A test fails with `IndexError: list index out of range` inside `for i in range(len(nums)): ... nums[i + 1]`. Fix?", "options": ["Use `range(len(nums) - 1)`", "Use `range(len(nums) + 1)`", "Wrap it in try/except", "Sort first"], "answer": 0, "why": "Mistake M5: on the last i, `i + 1` is past the end. Stop one early."}, {"id": "d26", "study": "00.5 Routine and Debugging \u203a The routine, with a real example", "topic": "debug", "q": "What should you do FIRST when you get a new problem?", "options": ["Start typing the code", "Restate it, work an example by hand, and note what it returns", "Look up the solution", "Write the fastest version you can think of"], "answer": 1, "why": "Understand first. Writing `RETURNS: ___` also guards against Mistake M6."}]};
const f = document.getElementById('f');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')}
QUIZ.questions.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  let h=`<div class="qh"><span>Q${i+1}</span><span>${esc(QUIZ.topics[q.topic]||q.topic)}</span></div><div class="qt">${inline(q.q)}</div>`;
  if(q.code) h+=`<pre>${esc(q.code)}</pre>`;
  q.options.forEach((o,j)=>{h+=`<label><input type="radio" name="q${i}" value="${j}">${inline(o)}</label>`});
  h+=`<div class="why">${inline(q.why)}${q.study?`<div class="study">If you missed it, study: <b>${inline(q.study)}</b></div>`:''}</div>`;d.innerHTML=h;f.appendChild(d);
});
document.getElementById('submit').onclick=()=>{
  let right=0;const per={};const missed=[];
  QUIZ.questions.forEach((q,i)=>{
    const d=document.getElementById('q'+i);d.classList.add('done');
    const pick=d.querySelector('input:checked');const labels=d.querySelectorAll('label');
    labels.forEach(l=>l.classList.remove('right','wrong'));
    labels[q.answer].classList.add('right');
    per[q.topic]=per[q.topic]||[0,0];per[q.topic][1]++;
    if(pick&&+pick.value===q.answer){right++;per[q.topic][0]++}
    else{if(pick)labels[+pick.value].classList.add('wrong');missed.push(i+1)}
  });
  const n=QUIZ.questions.length,pct=Math.round(100*right/n),pass=right/n>=QUIZ.pass_mark;
  let h=`<div class="big">${right}/${n} · ${pct}%</div><p>${pass?'<b style="color:var(--ok)">Gate passed.</b> '+QUIZ.pass_msg:'<b style="color:var(--bad)">Not yet.</b> '+QUIZ.fail_msg}</p><h3>By topic</h3>`;
  const weak=[];
  Object.entries(per).forEach(([t,[a,b]])=>{const p=a/b;if(p<0.8)weak.push(t);
    h+=`<div class="row"><span>${esc(QUIZ.topics[t]||t)}</span><span>${a}/${b}</span></div><div class="bar"><i style="width:${100*p}%;background:${p>=0.8?'var(--ok)':'var(--bad)'}"></i></div>`});
  if(weak.length){h+='<h3>Review these</h3><ul>'+weak.map(t=>`<li><b>${esc(QUIZ.topics[t]||t)}</b>: ${inline(QUIZ.review[t]||'')}</li>`).join('')+'</ul>'}
  if(missed.length){h+='<h3>Study list for your misses</h3><ol class="miss">'+missed.map(n=>{const q=QUIZ.questions[n-1];return `<li>Q${n}: ${inline(q.study||QUIZ.review[q.topic]||'')}</li>`}).join('')+'</ol>'}
  h+='<button id="copy">Copy results for Claude</button>';
  const r=document.getElementById('result');r.innerHTML=h;r.style.display='block';window.scrollTo(0,0);
  const summary=`${QUIZ.title}: ${right}/${n} (${pct}%). Weak topics: ${weak.map(t=>QUIZ.topics[t]).join(', ')||'none'}. Missed: ${missed.map(n=>'Q'+n+' ('+(QUIZ.questions[n-1].study||QUIZ.topics[QUIZ.questions[n-1].topic])+')').join('; ')||'none'}.`;
  document.getElementById('copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(summary);document.getElementById('copy').textContent='Copied'};
  try{const k='quiz:'+QUIZ.title;const hist=JSON.parse(localStorage.getItem(k)||'[]');hist.push({when:new Date().toISOString(),right,n});localStorage.setItem(k,JSON.stringify(hist.slice(-20)))}catch(e){}
};
document.getElementById('reset').onclick=()=>{f.reset();document.querySelectorAll('.q').forEach(d=>{d.classList.remove('done');d.querySelectorAll('label').forEach(l=>l.classList.remove('right','wrong'))});document.getElementById('result').style.display='none';window.scrollTo(0,0)};
</script></body></html>
