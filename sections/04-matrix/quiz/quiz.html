<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section 04 · Matrix Checkpoint</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d1d1b;--mut:#6b6a65;--line:#e3e1da;--acc:#2f5d8a;--ok:#2e7d4f;--bad:#b3412f;--code:#f0eee8}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1d1d1b;--ink:#ecebe6;--mut:#9c9a93;--line:#33322e;--acc:#7fb0e0;--ok:#6cc58f;--bad:#ec8a78;--code:#262522}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:1.5rem;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 24px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 14px}
.qh{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.qt{font-weight:600;margin:6px 0 10px}
pre{background:var(--code);border-radius:6px;padding:10px 12px;overflow-x:auto;font:14px/1.45 ui-monospace,Consolas,monospace;margin:0 0 10px}
label{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin:6px 0;cursor:pointer}
label:hover{border-color:var(--acc)}input{margin-right:8px}
label.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
label.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.why{display:none;margin-top:10px;padding:10px;border-left:3px solid var(--acc);background:var(--code);border-radius:4px;font-size:.95rem}
.done .why{display:block}
.study{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.9rem;color:var(--mut)}
.study b{color:var(--ink)}
ol.miss li{margin:4px 0}
button{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);cursor:pointer;margin:4px 8px 4px 0}
button.ghost{background:transparent;color:var(--acc)}
#result{display:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 20px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%}
.row{display:flex;justify-content:space-between;font-size:.95rem}
.big{font-size:2rem;font-weight:700}
code{font-family:ui-monospace,Consolas,monospace;background:var(--code);padding:1px 4px;border-radius:3px}
</style></head><body><main>
<h1>Section 04 · Matrix Checkpoint</h1><p class="sub">22 questions · pass mark 85% · no notes, no IDE, no AI</p>
<div id="result"></div>
<form id="f"></form>
<button id="submit">Score it</button><button class="ghost" id="reset">Start over</button>
</main>
<script>
const QUIZ = {"title": "Section 04 \u00b7 Matrix Checkpoint", "pass_mark": 0.85, "pass_msg": "This is one of four gate checks. Now do the cold solves in the section README.", "fail_msg": "Follow the study list for each miss, redo those labs, and retake in two days.", "topics": {"basics": "Grid basics (4.1)", "boxes": "Rows, columns, boxes (4.2)", "layers": "Rotation and spiral (4.3)", "inplace": "In place with markers (4.4)", "pick": "Picking the pattern"}, "review": {"basics": "Lesson 4.1. Redo labs 01 and 02, and trace the neighbors loop on paper.", "boxes": "Lesson 4.2. Redo lab 03.", "layers": "Lesson 4.3. Redo labs 04, 05, 06 and the Bug Hunt (09).", "inplace": "Lesson 4.4. Redo lab 07 (both versions), then lab 08.", "pick": "Read review/TRIGGERS.md. Cover the right columns and name each pattern."}, "questions": [{"id": "m01", "study": "4.1 Grid Basics \u203a A grid is a list of rows", "topic": "basics", "q": "grid = [[1, 2, 3], [4, 5, 6]]. What is `grid[0][2]`?", "options": ["3", "4", "2", "IndexError"], "answer": 0, "why": "Row 0 is [1, 2, 3]. Column 2 of it is 3."}, {"id": "m02", "study": "4.1 Grid Basics \u203a A grid is a list of rows", "topic": "basics", "q": "How do you get the number of columns?", "options": ["len(grid)", "len(grid[0])", "grid.cols", "len(grid) * len(grid[0])"], "answer": 1, "why": "len(grid) counts rows. Each row's length is the number of columns."}, {"id": "m03", "study": "4.1 Grid Basics \u203a Building a new grid", "topic": "basics", "q": "`g = [[0] * 3] * 2`, then `g[0][0] = 9`. What is `g`?", "options": ["[[9, 0, 0], [0, 0, 0]]", "[[9, 0, 0], [9, 0, 0]]", "[[9, 9, 9], [0, 0, 0]]", "Error"], "answer": 1, "why": "Both rows are the same list object. Build rows with a comprehension."}, {"id": "m04", "study": "4.1 Grid Basics \u203a Neighbors and the bounds check", "topic": "basics", "q": "You skip the bounds check and read `grid[-1][c]` for a cell in row 0. What happens?", "options": ["IndexError", "It reads the last row: a silent wrong answer", "It returns None", "It reads row 1"], "answer": 1, "why": "Negative indexes are legal in Python. Always check 0 <= nr < rows first."}, {"id": "m05", "study": "4.1 Grid Basics \u203a Walking every cell", "topic": "basics", "q": "Big-O of visiting every cell of an m \u00d7 n grid once?", "options": ["O(m + n)", "O(m \u00b7 n)", "O((m \u00b7 n)\u00b2)", "O(log m)"], "answer": 1, "why": "One visit per cell. That's linear in the grid's size."}, {"id": "m06", "study": "4.1 Grid Basics \u203a Diagonals", "topic": "basics", "q": "n \u00d7 n grid. Which cells are on the anti-diagonal?", "options": ["r == c", "r + c == n \u2212 1", "r \u2212 c == 1", "r + c == n"], "answer": 1, "why": "(0, n\u22121), (1, n\u22122) ... each pair sums to n \u2212 1."}, {"id": "m07", "study": "4.2 Rows, Columns, and Boxes \u203a Which box is a cell in?", "topic": "boxes", "q": "Sudoku box index for cell (7, 2)?", "options": ["2", "6", "7", "9"], "answer": 1, "why": "(7 // 3) * 3 + 2 // 3 = 2 * 3 + 0 = 6."}, {"id": "m08", "study": "4.2 Rows, Columns, and Boxes \u203a Three groups of sets", "topic": "boxes", "q": "Valid Sudoku: when can you return True?", "options": ["After the first valid row", "After every cell is checked", "When a box is full", "After 9 digits"], "answer": 1, "why": "Validity needs every cell. True comes after the loops. (M7)"}, {"id": "m09", "study": "4.2 Rows, Columns, and Boxes \u203a Common mistakes", "topic": "boxes", "q": "Why is `r // 3 + c // 3` a wrong box index?", "options": ["It's too slow", "It only gives 0\u20134, so different boxes collide", "It's off by one", "It ignores \".\""], "answer": 1, "why": "Box (0, 1) and box (1, 0) both give 1. Multiply the box row by 3."}, {"id": "m10", "study": "4.3 Rotation and Layers \u203a Rotate 90\u00b0 clockwise", "topic": "layers", "q": "Rotate an n \u00d7 n grid 90\u00b0 clockwise in place. Steps?", "options": ["Reverse each row, then transpose", "Transpose, then reverse each row", "Transpose twice", "Reverse the rows, then reverse each row"], "answer": 1, "why": "Two flips make a rotation, like the reversals in lesson 1.3."}, {"id": "m11", "study": "4.3 Rotation and Layers \u203a Rotate (in-place transpose)", "topic": "layers", "q": "In-place transpose swaps every (r, c) with (c, r) for ALL r and c. Result?", "options": ["Correct transpose", "The grid ends up unchanged", "IndexError", "Half transposed"], "answer": 1, "why": "Each pair is swapped twice. Loop only over c > r."}, {"id": "m12", "study": "4.3 Rotation and Layers \u203a Spiral order", "topic": "layers", "q": "Spiral Matrix: after walking the top row, which wall moves?", "options": ["bottom \u2212= 1", "top += 1", "left += 1", "right \u2212= 1"], "answer": 1, "why": "The top row is done, so the top wall moves down."}, {"id": "m13", "study": "4.3 Rotation and Layers \u203a Spiral order (re-checks)", "topic": "layers", "q": "Spiral on `[[1, 2, 3]]` with no re-check before the bottom row. Output?", "options": ["[1, 2, 3]", "[1, 2, 3, 2, 1]", "[3, 2, 1]", "[]"], "answer": 1, "why": "Top row gives 1 2 3 and right moves in. The 'bottom' row is the same row, so it walks back over 2 and 1 again. Re-check top <= bottom first."}, {"id": "m14", "study": "4.3 Rotation and Layers \u203a Spiral Matrix II (turning walker)", "topic": "layers", "q": "Turning walker with directions right, down, left, up. How do you turn right?", "options": ["d += 1", "d = (d + 1) % 4", "d = -d", "d = (d \u2212 1) % 4"], "answer": 1, "why": "Modulo wraps 'up' back to 'right'."}, {"id": "m15", "study": "4.4 In Place \u203a Set Matrix Zeroes (the trap)", "topic": "inplace", "q": "Set Matrix Zeroes: why not zero the row and column the moment you see a 0?", "options": ["It's too slow", "The new zeros trigger more zeroing", "Python forbids it", "It uses too much memory"], "answer": 1, "why": "The scan can't tell new zeros from original ones. Record first, write second."}, {"id": "m16", "study": "4.4 In Place \u203a Set Matrix Zeroes (the O(1) version)", "topic": "inplace", "q": "O(1) Set Matrix Zeroes stores its flags where?", "options": ["A set", "A copy of the grid", "Row 0 and column 0 of the grid", "A dictionary"], "answer": 2, "why": "Mark matrix[r][0] and matrix[0][c]. Save whether row 0 / column 0 had their own zeros first."}, {"id": "m17", "study": "4.4 In Place \u203a Set Matrix Zeroes (step 4)", "topic": "inplace", "q": "O(1) Set Matrix Zeroes: why zero row 0 and column 0 LAST?", "options": ["They're the biggest", "They hold flags the inner cells still need", "Tradition", "To save time"], "answer": 1, "why": "Zero them early and every column flag reads as 0."}, {"id": "m18", "study": "4.4 In Place \u203a Game of Life", "topic": "inplace", "q": "Game of Life in place: a cell holds 2. What does it mean?", "options": ["Dead \u2192 dead", "Live \u2192 live", "Live now, dead next", "Dead now, live next"], "answer": 2, "why": "2 remembers it WAS live, so neighbors still count it."}, {"id": "m19", "study": "4.4 In Place \u203a Game of Life (the rules)", "topic": "inplace", "q": "A dead cell has exactly 3 live neighbors. Next state?", "options": ["Dead", "Live"], "answer": 1, "why": "Reproduction: dead with exactly 3 becomes live."}, {"id": "m20", "study": "Review: review/TRIGGERS.md", "topic": "pick", "q": "\"Flip the image horizontally (mirror each row).\" Simplest tool?", "options": ["Reverse each row", "Transpose", "Spiral walk", "Sets per row"], "answer": 0, "why": "A mirror is one flip: reverse each row."}, {"id": "m21", "study": "Review: review/TRIGGERS.md", "topic": "pick", "q": "\"Is this grid the same after a 180\u00b0 turn?\" Fastest check?", "options": ["Rotate twice and compare", "Compare grid[r][c] with grid[m\u22121\u2212r][n\u22121\u2212c] for every cell", "Spiral order", "Sudoku sets"], "answer": 1, "why": "180\u00b0 maps (r, c) to (m\u22121\u2212r, n\u22121\u2212c). Compare directly, no copy needed."}, {"id": "m22", "study": "Review: review/TRIGGERS.md", "topic": "pick", "q": "\"Longest row-substring with no repeated letters.\" Which earlier pattern applies to each row?", "options": ["Sliding window, longest valid (Section 03)", "Two pointers from the ends", "Transpose", "Prefix sums"], "answer": 0, "why": "Each row is just a string. Grid problems often reuse 1D patterns row by row."}]};
const f = document.getElementById('f');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')}
QUIZ.questions.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  let h=`<div class="qh"><span>Q${i+1}</span><span>${esc(QUIZ.topics[q.topic]||q.topic)}</span></div><div class="qt">${inline(q.q)}</div>`;
  if(q.code) h+=`<pre>${esc(q.code)}</pre>`;
  q.options.forEach((o,j)=>{h+=`<label><input type="radio" name="q${i}" value="${j}">${inline(o)}</label>`});
  h+=`<div class="why">${inline(q.why)}${q.study?`<div class="study">If you missed it, study: <b>${inline(q.study)}</b></div>`:''}</div>`;d.innerHTML=h;f.appendChild(d);
});
document.getElementById('submit').onclick=()=>{
  let right=0;const per={};const missed=[];
  QUIZ.questions.forEach((q,i)=>{
    const d=document.getElementById('q'+i);d.classList.add('done');
    const pick=d.querySelector('input:checked');const labels=d.querySelectorAll('label');
    labels.forEach(l=>l.classList.remove('right','wrong'));
    labels[q.answer].classList.add('right');
    per[q.topic]=per[q.topic]||[0,0];per[q.topic][1]++;
    if(pick&&+pick.value===q.answer){right++;per[q.topic][0]++}
    else{if(pick)labels[+pick.value].classList.add('wrong');missed.push(i+1)}
  });
  const n=QUIZ.questions.length,pct=Math.round(100*right/n),pass=right/n>=QUIZ.pass_mark;
  let h=`<div class="big">${right}/${n} · ${pct}%</div><p>${pass?'<b style="color:var(--ok)">Gate passed.</b> '+QUIZ.pass_msg:'<b style="color:var(--bad)">Not yet.</b> '+QUIZ.fail_msg}</p><h3>By topic</h3>`;
  const weak=[];
  Object.entries(per).forEach(([t,[a,b]])=>{const p=a/b;if(p<0.8)weak.push(t);
    h+=`<div class="row"><span>${esc(QUIZ.topics[t]||t)}</span><span>${a}/${b}</span></div><div class="bar"><i style="width:${100*p}%;background:${p>=0.8?'var(--ok)':'var(--bad)'}"></i></div>`});
  if(weak.length){h+='<h3>Review these</h3><ul>'+weak.map(t=>`<li><b>${esc(QUIZ.topics[t]||t)}</b>: ${inline(QUIZ.review[t]||'')}</li>`).join('')+'</ul>'}
  if(missed.length){h+='<h3>Study list for your misses</h3><ol class="miss">'+missed.map(n=>{const q=QUIZ.questions[n-1];return `<li>Q${n}: ${inline(q.study||QUIZ.review[q.topic]||'')}</li>`}).join('')+'</ol>'}
  h+='<button id="copy">Copy results for Claude</button>';
  const r=document.getElementById('result');r.innerHTML=h;r.style.display='block';window.scrollTo(0,0);
  const summary=`${QUIZ.title}: ${right}/${n} (${pct}%). Weak topics: ${weak.map(t=>QUIZ.topics[t]).join(', ')||'none'}. Missed: ${missed.map(n=>'Q'+n+' ('+(QUIZ.questions[n-1].study||QUIZ.topics[QUIZ.questions[n-1].topic])+')').join('; ')||'none'}.`;
  document.getElementById('copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(summary);document.getElementById('copy').textContent='Copied'};
  try{const k='quiz:'+QUIZ.title;const hist=JSON.parse(localStorage.getItem(k)||'[]');hist.push({when:new Date().toISOString(),right,n});localStorage.setItem(k,JSON.stringify(hist.slice(-20)))}catch(e){}
};
document.getElementById('reset').onclick=()=>{f.reset();document.querySelectorAll('.q').forEach(d=>{d.classList.remove('done');d.querySelectorAll('label').forEach(l=>l.classList.remove('right','wrong'))});document.getElementById('result').style.display='none';window.scrollTo(0,0)};
</script></body></html>
